[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divpipe-engine"
version = "0.1.0"
description = "Vendor-agnostic dividend ingestion and QA engine"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["engine*","providers*"]

[project.scripts]
divpipe = "engine.divpipe.cli:main"

